name: Publish Tag to PyPI

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag or commit to build, test, and publish
        required: true
        type: string

jobs:
  build-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ${{ inputs.release_ref }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: package
          path: dist

  test-package:
    needs: build-package

    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.8", "3.9", "3.10", "3.11", "3.12" ]

    runs-on: ${{ matrix.os }}

    env:
      PYTHONUTF8: 1

    steps:
      - name: Checkout ${{ inputs.release_ref }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: package
          path: dist

      - name: Install package and dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Older PLAMS releases (2025) fail tests with ASE 3.28+
          python -m pip install "ase>=3.18,<3.28"
          python -m pip install ".[chem,ams,analysis,docs,examples,dev]"
          python -m pip install --force-reinstall --no-deps dist/plams-*.whl

      - name: Run Unit Tests
        working-directory: unit_tests
        run: |
          python -m pytest

  publish-package:
    runs-on: ubuntu-latest

    needs: test-package

    environment: release

    permissions:
      id-token: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: package
          path: dist

      - name: Publish package to Test PyPI
        if: ${{ vars.PUBLISH_TO_TEST_PYPI == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish package to PyPI
        if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
